name: Verify FACET trial validity and legacy paper arithmetic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic validator unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Recompute valid-only metrics and enforce documented legacy exclusions
        run: python3 eval/recompute_valid_only.py --known-invalid eval/known_invalid_records.json --output /tmp/facet-valid-only-report.json

      - name: Check historical v3 arithmetic (legacy, not a validity audit)
        run: python3 eval/verify_paper_numbers.py

      - name: Check bibliography identifiers against arXiv
        run: python3 eval/verify_citations.py
